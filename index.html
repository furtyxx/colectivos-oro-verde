<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Colectivos Oro Verde ⇄ Paraná</title>
  <meta name="description" content="Planificador de viajes en las líneas 6 y 15 entre Oro Verde y Paraná, con aviso de bajada por GPS.">
  <meta name="theme-color" content="#14532d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="barra">
    <h1 id="titulo">Oro Verde ⇄ Paraná</h1>
    <span id="estado-red" class="chip" hidden>sin conexión</span>
  </header>

  <main id="vista" tabindex="-1"><p class="cargando">Cargando…</p></main>

  <nav class="tabs" aria-label="Secciones">
    <a href="#planear" data-tab="planear"><span class="ico">🧭</span>Planear</a>
    <a href="#vivo" data-tab="vivo"><span class="ico">🚌</span>En viaje</a>
    <a href="#arribos" data-tab="arribos"><span class="ico">⏱️</span>Arribos</a>
    <a href="#lineas" data-tab="lineas"><span class="ico">📍</span>Líneas</a>
    <a href="#planillas" data-tab="planillas"><span class="ico">🗓️</span>Planillas</a>
    <a href="#ajustes" data-tab="ajustes"><span class="ico">⚙️</span>Ajustes</a>
  </nav>

  <div id="alerta" class="alerta" hidden role="alert" aria-live="assertive"></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script>
    // Si la app no arranca (por ejemplo, quedó una copia vieja guardada) se ofrece repararla sin perder planillas ni lugares.
    window.__rescate = function (detalle) {
      var v = document.getElementById('vista'); if (!v) return;
      // un fallo suelto del servidor (503, corte de internet) suele arreglarse solo: se reintenta una vez antes de mostrar el aviso
      try { if (!sessionStorage.getItem('reintento')) { sessionStorage.setItem('reintento', '1'); location.reload(); return; } } catch (e) { /* sin sessionStorage: muestro el aviso */ }
      v.innerHTML = '<div class="nota mal"><strong>La app no terminó de arrancar.</strong><p>Casi siempre es una copia vieja guardada en el teléfono. Tocá "Reparar": baja todo de nuevo y no borra tus planillas ni tus lugares.</p><p class="chico suave" id="rescate-detalle"></p><button class="btn pri" id="reparar">Reparar y reiniciar</button></div>';
      document.getElementById('rescate-detalle').textContent = detalle || '';
      document.getElementById('reparar').onclick = function () {
        var fin = function () { location.replace(location.pathname + '?r=' + Date.now()); };
        Promise.resolve(navigator.serviceWorker && navigator.serviceWorker.getRegistrations())
          .then(function (rs) { return Promise.all((rs || []).map(function (r) { return r.unregister(); })); })
          .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
          .then(fin, fin);
      };
    };
    window.__arranque = setTimeout(function () { if (!window.__listo) window.__rescate('Pasaron 8 segundos sin que cargara.'); }, 8000);
    window.addEventListener('error', function (e) { if (!window.__listo) window.__rescate((e.message || 'error') + (e.filename ? ' — ' + e.filename.split('/').pop() : '')); });
    window.addEventListener('unhandledrejection', function (e) { if (!window.__listo) window.__rescate(String((e.reason && e.reason.message) || e.reason)); });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
