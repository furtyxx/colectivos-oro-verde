name: Actualizar recorridos

# Todos los días revisa las páginas de Paraná Online y, si cambió algún recorrido o parada,
# guarda los datos nuevos (la app los toma sola la próxima vez que se abre con conexión).
on:
  schedule:
    - cron: '30 7 * * *'   # 04:30 de Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer Paraná Online
        run: node tools/actualizar.mjs
      - name: Rearmar los servicios con los recorridos nuevos
        run: node tools/horarios.mjs --solo
      - name: Guardar si hubo cambios
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineas.json data/cambios.json data/horarios.json
          git diff --cached --quiet || (git commit -m "Datos: revisión automática de recorridos" && git pull --rebase && git push)
