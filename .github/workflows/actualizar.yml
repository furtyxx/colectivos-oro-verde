name: Actualizar recorridos

# Recorridos y paradas de todas las líneas desde Paraná Online. Normalmente lo hace solo el trabajo
# "Juntar horarios" una vez por día; esto sirve para forzarlo a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer Paraná Online
        run: node tools/actualizar.mjs
      - name: Rearmar los servicios con los recorridos nuevos
        run: node tools/horarios.mjs --solo
      - name: Guardar si hubo cambios
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineas.json data/cambios.json data/horarios.json data/historial
          git diff --cached --quiet || (git commit -m "Datos: revisión automática de recorridos" && git pull --rebase && git push)
