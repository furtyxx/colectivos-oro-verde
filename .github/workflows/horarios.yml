name: Juntar horarios

# Cada media hora mira qué colectivos anuncia Paraná Online para cada parada en las próximas dos horas y los
# va sumando a data/horarios/. Con un día entero de cada tipo (hábil, sábado, domingo) queda el horario
# completo de todas las líneas. Solo guarda cuando aparece algo nuevo.
on:
  schedule:
    - cron: '5,35 7-23 * * *'   # 04:05 a 20:35 de Argentina
    - cron: '5,35 0-3 * * *'    # 21:05 a 00:35 de Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  horarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tomar una muestra de horarios
        run: node tools/horarios.mjs
      - name: Guardar si hubo novedades
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/horarios data/horarios.json
          git diff --cached --quiet || (git commit -m "Datos: horarios de Paraná Online" && git pull --rebase && git push)
